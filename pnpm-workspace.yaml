packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  node-pty: true

minimumReleaseAgeExclude:
  - electron@44.3.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
