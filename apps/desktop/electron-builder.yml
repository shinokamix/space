appId: dev.space.desktop
productName: Space
directories:
  output: release
files:
  - out/**/*
  - package.json
  - "!node_modules/@space/*/src{,/**/*}"
  - "!node_modules/@space/runtime/*.db{,-shm,-wal}"
  - "!node_modules/@space/*/dist/**/*.test.js"
  - "!node_modules/@space/*/tsconfig*.json"
  - "!node_modules/@space/*/vitest.config.*"
asarUnpack:
  - node_modules/node-pty/**
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target: nsis
linux:
  category: Development
  target:
    - AppImage
    - deb
